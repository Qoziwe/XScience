name: Deploy frontend to GitHub Pages

# Builds frontend/ and publishes it to GitHub Pages (custom domain —
# frontend/public/CNAME). The backend (Flask) lives separately, on your own
# server — see VITE_API_BASE_URL below and backend/README.md, "Before Production".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API: http
          # Backend address (§18) — change this if the domain changes.
          VITE_API_BASE_URL: https://xscienceapi.andatra.space/api
        run: npm run build

      - name: SPA fallback for direct links to /console and /login
        # GitHub Pages is static hosting with no server-side rerouting: without
        # this, refreshing the page on /console gives a 404. 404.html is an
        # exact copy of index.html; React Router resolves the path client-side.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
