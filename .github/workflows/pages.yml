name: Deploy frontend to GitHub Pages

# Собирает frontend/ и публикует на GitHub Pages (кастомный домен —
# frontend/public/CNAME). Бэкенд (Flask) живёт отдельно, на вашем сервере —
# см. VITE_API_BASE_URL ниже и backend/README.md, раздел «Перед продом».

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API: http
          # Адрес бэкенда (§18) — поменяйте, если домен сменится.
          VITE_API_BASE_URL: https://xscienceapi.andatra.space/api
        run: npm run build

      - name: SPA fallback для прямых ссылок на /console и /login
        # GitHub Pages — статика без серверных рероутов: без этого обновление
        # страницы на /console даёт 404. 404.html — точная копия index.html,
        # React Router разбирается с путём на клиенте сам.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
